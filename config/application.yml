# Local model tests read this file directly. Replace only the API key when using OpenAI.
# For another compatible provider, also update the URL and model names.
# Never commit a real key. Production deployments must override secrets through a secret manager.
spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: replace-with-your-api-key
      base-url: https://api.openai.com/v1
      max-retries: 0
      chat:
        model: gpt-4.1-mini
      embedding:
        model: text-embedding-3-small
