# Knowledge Service and Ticket Agent Service import this shared model configuration.
# Replace the API key and choose an Embedding Provider supported by your endpoint.
# The Ollama block is a local option; switch spring.ai.model.embedding to ollama to use it.
# Never commit a real key. Company deployments must override secrets through their secret manager.
spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: replace-with-your-api-key
      base-url: https://api.openai.com/v1
      max-retries: 0
      chat:
        model: gpt-4.1-mini
      embedding:
        model: text-embedding-3-small
    ollama:
      base-url: http://localhost:11434
      embedding:
        model: qwen3-embedding:4b
        truncate: true

java-ai:
  knowledge:
    embedding:
      mode: provider
