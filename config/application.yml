# Knowledge Service and Ticket Agent Service import this shared model configuration.
# For local learning, replace only the API key. Compatible providers may also need another URL and model name.
# Never commit a real key. Company deployments must override secrets through their secret manager.
spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: replace-with-your-api-key
      base-url: https://api.openai.com/v1
      max-retries: 0
      chat:
        model: gpt-4.1-mini
      embedding:
        model: text-embedding-3-small
