# Copy this file to config/application.yml for local model tests.
# With OpenAI, replace only the API key. For another compatible provider, also update the URL and model names.
# config/application.yml is ignored by Git. Production deployments must override secrets through a secret manager.
spring:
  ai:
    model:
      chat: openai
      embedding: openai
    openai:
      api-key: replace-with-your-api-key
      base-url: https://api.openai.com/v1
      max-retries: 0
      chat:
        model: gpt-4.1-mini
      embedding:
        model: text-embedding-3-small
