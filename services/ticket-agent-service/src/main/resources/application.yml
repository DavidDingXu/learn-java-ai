server:
  port: 8082

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: ticket-agent-service
  datasource:
    url: ${JAVA_AI_TICKET_DB_URL}
    username: ${JAVA_AI_TICKET_DB_USERNAME}
    password: ${JAVA_AI_TICKET_DB_PASSWORD}
    hikari:
      maximum-pool-size: ${JAVA_AI_TICKET_DB_POOL_SIZE:10}
  flyway:
    enabled: true
  ai:
    retry:
      max-attempts: 1
    model:
      audio:
        speech: none
        transcription: none
      chat: openai
      embedding: none
      image: none
      moderation: none
    openai:
      api-key: ${JAVA_AI_CHAT_API_KEY}
      base-url: ${JAVA_AI_CHAT_BASE_URL}
      chat:
        model: ${JAVA_AI_CHAT_MODEL}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

java-ai:
  persistence:
    mode: jdbc
    confirmation-lease: ${JAVA_AI_CONFIRMATION_LEASE:30s}
  runtime:
    external-integrations-enabled: true
  agent:
    downstream-enabled: true
    max-steps: ${JAVA_AI_AGENT_MAX_STEPS:4}
    max-concurrent-runs: ${JAVA_AI_AGENT_MAX_CONCURRENT_RUNS:16}
    confirmation-ttl: ${JAVA_AI_CONFIRMATION_TTL:15m}
    allowed-queues: ${JAVA_AI_AGENT_ALLOWED_QUEUES:refund-review,tier-2}
    knowledge-base-url: ${JAVA_AI_KNOWLEDGE_BASE_URL}
    legacy-tool-base-url: ${JAVA_AI_LEGACY_TOOL_BASE_URL}
    downstream-timeout: ${JAVA_AI_DOWNSTREAM_TIMEOUT:3s}
    downstream-token-mode: ${JAVA_AI_DOWNSTREAM_TOKEN_MODE}
    delegated-token:
      issuer: ${JAVA_AI_JWT_ISSUER}
      hmac-secret: ${JAVA_AI_DEV_JWT_HMAC_SECRET}
      actor-id: ticket-agent-service
      ttl: 2m
  security:
    jwt:
      enabled: true
      issuer: ${JAVA_AI_JWT_ISSUER}
      audience: ticket-agent-service
      jwk-set-uri: ${JAVA_AI_JWT_JWK_SET_URI:}
      hmac-secret: ${JAVA_AI_DEV_JWT_HMAC_SECRET:}
