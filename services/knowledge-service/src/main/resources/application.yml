# The default demo profile starts without a database or identity provider.
# Never commit real production secrets. Override production placeholders through the deployment secret manager.
server:
  port: 8081

spring:
  profiles:
    default: demo
  application:
    name: knowledge-service
  reactor:
    context-propagation: auto
  codec:
    max-in-memory-size: 6MB
  jackson:
    deserialization:
      fail-on-unknown-properties: true

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

resilience4j:
  circuitbreaker:
    instances:
      knowledgeAnswer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  bulkhead:
    instances:
      knowledgeAnswer:
        max-concurrent-calls: 20
        max-wait-duration: 0

java-ai:
  prompt:
    knowledge-answer:
      version: knowledge-answer-v1
  knowledge:
    answer:
      total-timeout: 30s
      retry:
        max-attempts: 2
        delay: 100ms
    retrieval:
      top-k: 6
      candidate-k: 20
      lexical-search: true
      rewrite-query: false
      rerank: false
    indexing:
      worker-id: knowledge-indexer-local
      scheduler-enabled: true
      scheduler-initial-delay: 5s
      scheduler-delay: 1s
      lease-duration: 45s
      retry-delay: 2m
      maximum-attempts: 3
      max-chunk-characters: 1000
      chunk-policy-version: policy-chunk-v1
      embedding-batch-size: 16

---
spring:
  config:
    activate:
      on-profile: demo
  autoconfigure:
    exclude:
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
      - org.springframework.boot.flyway.autoconfigure.FlywayAutoConfiguration
  flyway:
    enabled: false
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: none
      embedding: none
      image: none
      moderation: none

java-ai:
  runtime:
    external-integrations-enabled: false
  security:
    jwt:
      enabled: false
  knowledge:
    context-source: classpath
    ingestion:
      enabled: false
    object-store:
      local-root: ./var/knowledge-objects

---
spring:
  config:
    activate:
      on-profile: production
  flyway:
    enabled: true
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: openai
      embedding: openai
      image: none
      moderation: none
    openai:
      api-key: replace-with-secret-manager
      base-url: https://api.openai.com/v1
      max-retries: 0
      chat:
        model: gpt-4.1-mini
      embedding:
        model: text-embedding-3-small

java-ai:
  runtime:
    external-integrations-enabled: true
  security:
    jwt:
      enabled: true
      issuer: https://identity.example.com
      audience: knowledge-service
      jwk-set-uri: https://identity.example.com/.well-known/jwks.json
      hmac-secret: ""
      allowed-actors: customer-bff,ticket-agent-service,knowledge-admin-service
  knowledge:
    context-source: retrieval
    ingestion:
      enabled: true
    object-store:
      local-root: ./var/knowledge-objects
    postgres:
      jdbc-url: jdbc:postgresql://database.example.com:5432/java_ai_knowledge
      username: java_ai_knowledge
      password: replace-with-secret-manager
      maximum-pool-size: 10
