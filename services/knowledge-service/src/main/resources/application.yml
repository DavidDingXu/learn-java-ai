server:
  port: 8081

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: knowledge-service
  reactor:
    context-propagation: auto
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  flyway:
    enabled: true
  ai:
    retry:
      max-attempts: 1
    model:
      audio:
        speech: none
        transcription: none
      chat: openai
      embedding: openai
      image: none
      moderation: none
    openai:
      api-key: ${JAVA_AI_CHAT_API_KEY}
      base-url: ${JAVA_AI_CHAT_BASE_URL}
      chat:
        model: ${JAVA_AI_CHAT_MODEL}
      embedding:
        model: ${JAVA_AI_EMBEDDING_MODEL}

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

resilience4j:
  retry:
    instances:
      knowledgeAnswer:
        max-attempts: 2
        wait-duration: 100ms
  circuitbreaker:
    instances:
      knowledgeAnswer:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 20
        minimum-number-of-calls: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
  timelimiter:
    instances:
      knowledgeAnswer:
        timeout-duration: 8s
        cancel-running-future: true
  bulkhead:
    instances:
      knowledgeAnswer:
        max-concurrent-calls: 20
        max-wait-duration: 0

java-ai:
  runtime:
    external-integrations-enabled: true
  prompt:
    knowledge-answer:
      version: knowledge-answer-v1
  security:
    jwt:
      enabled: true
      issuer: ${JAVA_AI_JWT_ISSUER}
      audience: ${JAVA_AI_JWT_AUDIENCE:knowledge-service}
      jwk-set-uri: ${JAVA_AI_JWT_JWK_SET_URI:}
      hmac-secret: ${JAVA_AI_DEV_JWT_HMAC_SECRET:}
      allowed-actors: ${JAVA_AI_JWT_ALLOWED_ACTORS:customer-bff,ticket-agent-service}
  knowledge:
    context-source: retrieval
    postgres:
      jdbc-url: ${JAVA_AI_POSTGRES_URL}
      username: ${JAVA_AI_POSTGRES_USER}
      password: ${JAVA_AI_POSTGRES_PASSWORD}
      maximum-pool-size: ${JAVA_AI_POSTGRES_POOL_SIZE:10}
    retrieval:
      mode: hybrid
      top-k: ${JAVA_AI_RETRIEVAL_TOP_K:6}
      embedding-dimensions: ${JAVA_AI_EMBEDDING_DIMENSIONS:1536}
      candidate-k: ${JAVA_AI_RETRIEVAL_CANDIDATE_K:20}
      lexical-search: true
      rewrite-query: false
      rerank: false
