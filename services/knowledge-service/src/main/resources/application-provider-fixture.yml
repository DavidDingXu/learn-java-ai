spring:
  ai:
    model:
      audio:
        speech: none
        transcription: none
      chat: openai
      embedding: none
      image: none
      moderation: none
    openai:
      api-key: ${JAVA_AI_CHAT_API_KEY:fixture-key}
      base-url: ${JAVA_AI_CHAT_BASE_URL:http://127.0.0.1:1}
      chat:
        model: ${JAVA_AI_CHAT_MODEL:fixture-model}

java-ai:
  runtime:
    execution-mode: PROVIDER_PROTOCOL_FIXTURE
    external-integrations-enabled: true
