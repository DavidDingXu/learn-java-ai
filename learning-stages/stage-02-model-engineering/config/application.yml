# Fill in these values, open this stage as an IDEA project, then start KnowledgeServiceApplication.
spring:
  ai:
    model:
      chat: openai
      embedding: none
    openai:
      api-key: replace-with-your-api-key
      base-url: https://api.openai.com/v1
      max-retries: 0
      chat:
        model: gpt-4.1-mini
