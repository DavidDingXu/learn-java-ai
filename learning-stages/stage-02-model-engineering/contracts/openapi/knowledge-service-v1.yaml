openapi: 3.1.0
info:
  title: Knowledge Service API - Model Engineering Stage
  version: 1.0.0
  description: Stage 02 exposes only model answers and SSE streaming.
servers:
  - url: http://localhost:8081
paths:
  /api/v1/knowledge/answers:
    post:
      operationId: answerKnowledgeQuestion
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeAnswerRequest'
      responses:
        '200':
          description: Grounded answer or structured refusal.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/KnowledgeAnswerResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/Busy'
        '502':
          $ref: '#/components/responses/InvalidModelOutput'
        '503':
          $ref: '#/components/responses/ModelUnavailable'
        '504':
          $ref: '#/components/responses/ModelTimeout'
  /api/v1/knowledge/answers/stream:
    post:
      operationId: streamKnowledgeAnswer
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/KnowledgeAnswerRequest'
      responses:
        '200':
          description: SSE events named metadata, delta, heartbeat, citation, completed or error.
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/AnswerStreamEvent'
        '400':
          $ref: '#/components/responses/BadRequest'
        '429':
          $ref: '#/components/responses/Busy'
        '503':
          $ref: '#/components/responses/ModelUnavailable'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Request validation failed.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    Busy:
      description: Model concurrency limit reached.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    InvalidModelOutput:
      description: Provider response cannot be mapped to a valid business answer.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ModelUnavailable:
      description: Model is not configured, rate limited, circuit open or unavailable.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
    ModelTimeout:
      description: Model call exceeded the server timeout.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ProblemDetail'
  schemas:
    KnowledgeAnswerRequest:
      type: object
      additionalProperties: false
      required: [question]
      properties:
        question:
          type: string
          minLength: 1
          maxLength: 2000
        conversationContext:
          $ref: '#/components/schemas/ConversationContext'
    ConversationContext:
      type: object
      additionalProperties: false
      properties:
        summary:
          type: string
          maxLength: 1000
          default: ''
        turns:
          type: array
          maxItems: 12
          default: []
          items:
            $ref: '#/components/schemas/ConversationTurn'
    ConversationTurn:
      type: object
      additionalProperties: false
      required: [role, content]
      properties:
        role:
          type: string
          enum: [USER, ASSISTANT]
        content:
          type: string
          minLength: 1
          maxLength: 1000
    KnowledgeAnswerResponse:
      type: object
      additionalProperties: false
      required: [answer, citations, refused, model, usage, finishReason, traceId]
      properties:
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: '#/components/schemas/Citation'
        refused:
          type: boolean
        refusalReason:
          type: [string, 'null']
        model:
          type: string
        usage:
          $ref: '#/components/schemas/ModelUsage'
        finishReason:
          type: string
        traceId:
          type: string
    Citation:
      type: object
      additionalProperties: false
      required: [documentId, version, sectionId, title]
      properties:
        documentId:
          type: string
        version:
          type: string
        sectionId:
          type: string
        title:
          type: string
    ModelUsage:
      type: object
      additionalProperties: false
      required: [promptTokens, completionTokens, totalTokens]
      properties:
        promptTokens:
          type: integer
          minimum: 0
        completionTokens:
          type: integer
          minimum: 0
        totalTokens:
          type: integer
          minimum: 0
    AnswerStreamEvent:
      oneOf:
        - $ref: '#/components/schemas/MetadataEvent'
        - $ref: '#/components/schemas/DeltaEvent'
        - $ref: '#/components/schemas/HeartbeatEvent'
        - $ref: '#/components/schemas/CitationEvent'
        - $ref: '#/components/schemas/CompletedEvent'
        - $ref: '#/components/schemas/ErrorEvent'
    MetadataEvent:
      type: object
      additionalProperties: false
      required: [traceId, promptVersion]
      properties:
        traceId:
          type: string
        promptVersion:
          type: string
    DeltaEvent:
      type: object
      additionalProperties: false
      required: [text]
      properties:
        text:
          type: string
    HeartbeatEvent:
      type: object
      additionalProperties: false
      required: [epochMillis]
      properties:
        epochMillis:
          type: integer
          format: int64
    CitationEvent:
      type: object
      additionalProperties: false
      required: [citation]
      properties:
        citation:
          $ref: '#/components/schemas/Citation'
    CompletedEvent:
      type: object
      additionalProperties: false
      required: [model, usage, finishReason, ttftMillis, refused]
      properties:
        model:
          type: string
        usage:
          $ref: '#/components/schemas/ModelUsage'
        finishReason:
          type: string
        ttftMillis:
          type: integer
          format: int64
          minimum: 0
        refused:
          type: boolean
        refusalReason:
          type: [string, 'null']
    ErrorEvent:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
    ProblemDetail:
      type: object
      additionalProperties: true
      required: [status, title, detail]
      properties:
        status:
          type: integer
        title:
          type: string
        detail:
          type: string
        code:
          type: string
