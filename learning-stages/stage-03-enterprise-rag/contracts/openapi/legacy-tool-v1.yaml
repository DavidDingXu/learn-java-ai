openapi: 3.1.0
info:
  title: Legacy Tool Action API
  version: 1.0.0
  description: Stable HTTP boundary owned by the JDK 8 business system. Identity comes only from the service token.
servers:
  - url: http://localhost:8090
paths:
  /api/v1/tool-actions:
    post:
      operationId: executeToolAction
      security:
        - bearerAuth: []
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema:
            type: string
            minLength: 8
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/tool-action-command-v1.schema.json
      responses:
        '200':
          description: The action executed or the original idempotent receipt was returned.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ToolActionReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Rejected'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    BadRequest:
      description: Invalid command syntax.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Missing or invalid service token.
    Forbidden:
      description: The service token lacks tool execution permission.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: The idempotency key was reused for a different command.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Rejected:
      description: The command is valid but the current business state rejects the action.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    ToolActionReceipt:
      type: object
      additionalProperties: false
      required: [actionId, status, duplicate, auditId]
      properties:
        actionId:
          type: string
          minLength: 1
          maxLength: 64
        status:
          type: string
          enum: [SUCCEEDED]
        duplicate:
          type: boolean
        auditId:
          type: string
          minLength: 1
          maxLength: 128
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
