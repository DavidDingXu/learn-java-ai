openapi: 3.1.0
info:
  title: Agent Task Intake API - Customer Consultation Stage
  version: 1.0.0
  description: Stage 04 accepts handoff tasks. Planning, tools, confirmation and audit start in stage 05.
servers:
  - url: http://localhost:8082
paths:
  /api/v1/agent/tasks:
    post:
      operationId: createAgentTask
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: ../json-schema/agent-task-request-v1.schema.json
      responses:
        '202':
          description: Task accepted. A matching retry returns the original receipt.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentTaskReceipt'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
  responses:
    BadRequest:
      description: Task request or idempotency key is invalid.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Unauthorized:
      description: Access token is missing or invalid in JWT mode.
    Forbidden:
      description: Trusted identity does not belong to the expected customer-bff actor or scope.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
    Conflict:
      description: The idempotency key was reused with a different request.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiError'
  schemas:
    AgentTaskReceipt:
      type: object
      additionalProperties: false
      required: [taskId, status, duplicate]
      properties:
        taskId:
          type: string
          minLength: 1
        status:
          type: string
          enum: [ACCEPTED]
        duplicate:
          type: boolean
    ApiError:
      type: object
      additionalProperties: false
      required: [code, message]
      properties:
        code:
          type: string
        message:
          type: string
