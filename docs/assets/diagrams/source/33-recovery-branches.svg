          <text x="345" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">EXECUTION_UNCERTAIN</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="504" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">查询业务事实，禁止盲目重放</tspan></text></g>
  <g data-diagram-note="true">
    <rect x="76" y="600" width="6" height="96" rx="3" fill="#2F6FED"/>
    <text x="104" y="630" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="540" fill="#5D6B73" letter-spacing="0"><tspan x="104" dy="0">任务状态是恢复入口。只在日志里打印异常而不改变状态，会让客服和运维无法判断下一步。</tspan><tspan x="104" dy="34"></tspan></text>
