<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="840" viewBox="0 0 1200 840">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C8D5DA"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FED"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#178A68"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B66B12"/></marker>
    <marker id="arrowCoral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84B4B"/></marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#DFE8EB" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="840" fill="#F6F9FA"/>
  <rect width="1200" height="840" fill="url(#grid)" opacity="0.24"/>
  <rect data-content-frame="true" x="36" y="30" width="1128" height="780" rx="16" fill="#FFFFFF" stroke="#D7E2E6" stroke-width="2"/>
  <rect x="76" y="64" width="56" height="6" rx="3" fill="#2F6FED"/>
  <text x="76" y="100" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="750" fill="#2F6FED" letter-spacing="0"><tspan x="76" dy="0">AGENT TASK STATE</tspan></text>
  <text x="76" y="146" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="760" fill="#14242D" letter-spacing="0"><tspan x="76" dy="0">业务任务状态不能由模型自由书写</tspan></text>
  <text x="76" y="192" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="450" fill="#5D6B73" letter-spacing="0"><tspan x="76" dy="0">每个状态只允许有限迁移，确认、远程执行和不确定结果都有独立位置</tspan></text>
  <g data-diagram-kind="matrix"><rect data-bounded="true" data-matrix-header="true" x="92" y="240" width="238" height="66" fill="#14242D" stroke="#FFFFFF" stroke-width="2"/>
        <text x="107" y="281" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="107" dy="0">阶段</tspan></text><rect data-bounded="true" data-matrix-header="true" x="330" y="240" width="389" height="66" fill="#2F6FED" stroke="#FFFFFF" stroke-width="2"/>
        <text x="345" y="281" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="345" dy="0">状态</tspan></text><rect data-bounded="true" data-matrix-header="true" x="719" y="240" width="389" height="66" fill="#2F6FED" stroke="#FFFFFF" stroke-width="2"/>
        <text x="734" y="281" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="734" dy="0">处理语义</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="306" width="238" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">接收与规划</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="306" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">ACCEPTED / RUNNING</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="306" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">任务已接收，或正在有限步数内规划与执行只读 Tool</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="372" width="238" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="413" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">等待人工</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="372" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="413" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">WAITING_CONFIRMATION</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="372" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="413" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">已经形成确定写动作，等待匹配角色和任务版本的确认</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="438" width="238" height="98" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="495" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">远程执行</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="438" width="389" height="98" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="495" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">EXECUTING</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="438" width="389" height="98" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="479" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">确认已通过，使用稳定 actionId 和幂等键调用最终业务系</tspan><tspan x="734" dy="32">统</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="536" width="238" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="577" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">确定结束</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="536" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="577" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">COMPLETED / REJECTED / FAILED</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="536" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="577" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">成功、明确拒绝或确定失败，均有可解释结果</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="602" width="238" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="643" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">结果未知</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="602" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="643" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">EXECUTION_UNCERTAIN</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="602" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="643" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">远端可能已成功，先查询或对账，禁止盲目重放</tspan></text></g>
  <g data-diagram-note="true">
    <rect x="76" y="698" width="6" height="96" rx="3" fill="#2F6FED"/>
    <text x="104" y="728" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="540" fill="#5D6B73" letter-spacing="0"><tspan x="104" dy="0">EXECUTION_UNCERTAIN 不是普通失败：远端可能已经成功，恢复动作必须先查询业务结</tspan><tspan x="104" dy="34">果，不能盲目重放。</tspan></text>
  </g>
</svg>