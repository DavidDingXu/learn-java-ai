        <text x="504" y="496" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="504" dy="0">独立用例适配器与实验依赖</tspan></text><path d="M 600 530 V 547" fill="none" stroke="#C8D5DA" stroke-width="4" marker-end="url(#arrow)"/><rect data-bounded="true" data-layer="true" x="164" y="552" width="872" height="78" rx="10" fill="#F6F9FA" stroke="#14242D" stroke-width="2"/>
