        <text x="528" y="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="528" dy="0">共享 ChatModel、Message、Tool DTO 或领域 JAR</tspan></text></g>
  <g data-diagram-note="true">
    <rect x="76" y="660" width="6" height="62" rx="3" fill="#2F6FED"/>
    <text x="104" y="690" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="540" fill="#5D6B73" letter-spacing="0"><tspan x="104" dy="0">共存的关键不是两个 Bean 都能启动，而是升级和故障能够独立处理。</tspan></text>
