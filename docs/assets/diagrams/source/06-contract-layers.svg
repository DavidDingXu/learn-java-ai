<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="802" viewBox="0 0 1200 802">
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C8D5DA"/></marker>
    <marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2F6FED"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#178A68"/></marker>
    <marker id="arrowAmber" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#B66B12"/></marker>
    <marker id="arrowCoral" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#C84B4B"/></marker>
    <pattern id="grid" width="48" height="48" patternUnits="userSpaceOnUse"><path d="M 48 0 L 0 0 0 48" fill="none" stroke="#DFE8EB" stroke-width="1"/></pattern>
  </defs>
  <rect width="1200" height="802" fill="#F6F9FA"/>
  <rect width="1200" height="802" fill="url(#grid)" opacity="0.24"/>
  <rect data-content-frame="true" x="36" y="30" width="1128" height="742" rx="16" fill="#FFFFFF" stroke="#D7E2E6" stroke-width="2"/>
  <rect x="76" y="64" width="56" height="6" rx="3" fill="#2F6FED"/>
  <text x="76" y="100" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="750" fill="#2F6FED" letter-spacing="0"><tspan x="76" dy="0">CROSS-RUNTIME CONTRACT</tspan></text>
  <text x="76" y="146" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="760" fill="#14242D" letter-spacing="0"><tspan x="76" dy="0">Java 8 和 Java 21 之间只共享 HTTP 接口</tspan></text>
  <text x="76" y="192" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="450" fill="#5D6B73" letter-spacing="0"><tspan x="76" dy="0">运行时、依赖树和领域类分开，HTTP 协议成为可长期维护的边界</tspan></text>
  <g data-diagram-kind="layers"><rect data-bounded="true" data-layer="true" x="92" y="240" width="1016" height="78" rx="10" fill="#EAF1FF" stroke="#2F6FED" stroke-width="2"/>
        <rect x="92" y="240" width="340" height="78" rx="10" fill="#2F6FED"/>
        <text x="114" y="288" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="114" dy="0">OpenAPI</tspan></text>
        <text x="456" y="288" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="456" dy="0">路径、方法、认证和状态码</tspan></text><path d="M 600 322 V 339" fill="none" stroke="#C8D5DA" stroke-width="4" marker-end="url(#arrow)"/><rect data-bounded="true" data-layer="true" x="116" y="344" width="968" height="78" rx="10" fill="#E5F5EF" stroke="#178A68" stroke-width="2"/>
        <rect x="116" y="344" width="340" height="78" rx="10" fill="#178A68"/>
        <text x="138" y="392" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="138" dy="0">JSON Schema</tspan></text>
        <text x="480" y="392" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="480" dy="0">请求、响应、错误与兼容规则</tspan></text><path d="M 600 426 V 443" fill="none" stroke="#C8D5DA" stroke-width="4" marker-end="url(#arrow)"/><rect data-bounded="true" data-layer="true" x="140" y="448" width="920" height="78" rx="10" fill="#FFF2DE" stroke="#B66B12" stroke-width="2"/>
        <rect x="140" y="448" width="340" height="78" rx="10" fill="#B66B12"/>
        <text x="162" y="496" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="162" dy="0">Operational Contract</tspan></text>
        <text x="504" y="496" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="504" dy="0">超时、幂等键、重试和任务查询</tspan></text><path d="M 600 530 V 547" fill="none" stroke="#C8D5DA" stroke-width="4" marker-end="url(#arrow)"/><rect data-bounded="true" data-layer="true" x="164" y="552" width="872" height="78" rx="10" fill="#F6F9FA" stroke="#14242D" stroke-width="2"/>
        <rect x="164" y="552" width="340" height="78" rx="10" fill="#14242D"/>
        <text x="186" y="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="186" dy="0">Independent Clients</tspan></text>
        <text x="528" y="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="528" dy="0">Java 8 客户端与 Java 21 服务各自构建</tspan></text></g>
  <g data-diagram-note="true">
    <rect x="76" y="660" width="6" height="96" rx="3" fill="#2F6FED"/>
    <text x="104" y="690" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="540" fill="#5D6B73" letter-spacing="0"><tspan x="104" dy="0">不要把 Java 21 DTO 打成共享 JAR 给老系统，它会把字节码、注解和框架依赖一起带过</tspan><tspan x="104" dy="34">去。</tspan></text>
  </g>
</svg>