        <text x="504" y="496" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="504" dy="0">问题、答案、检索指标和确认状态保持稳定</tspan></text><path d="M 600 530 V 547" fill="none" stroke="#C8D5DA" stroke-width="4" marker-end="url(#arrow)"/><rect data-bounded="true" data-layer="true" x="164" y="552" width="872" height="78" rx="10" fill="#F6F9FA" stroke="#14242D" stroke-width="2"/>
        <rect x="164" y="552" width="340" height="78" rx="10" fill="#14242D"/>
        <text x="186" y="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="186" dy="0">引入条件</tspan></text>
        <text x="528" y="600" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="528" dy="0">依赖兼容、回归通过、指标达标并且可以回滚</tspan></text></g>
  <g data-diagram-note="true">
    <rect x="76" y="660" width="6" height="62" rx="3" fill="#2F6FED"/>
    <text x="104" y="690" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="540" fill="#5D6B73" letter-spacing="0"><tspan x="104" dy="0">隔离不是否定框架，而是防止一次实验升级整个应用平台。</tspan></text>
