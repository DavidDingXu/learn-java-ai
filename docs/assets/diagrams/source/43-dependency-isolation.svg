        <text x="480" y="392" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="480" dy="0">Spring AI Alibaba 1.1.2.x，验证 DashScope 与 Graph</tspan></text><path d="M 600 426 V 443" fill="none" stroke="#C8D5DA" stroke-width="4" marker-end="url(#arrow)"/><rect data-bounded="true" data-layer="true" x="140" y="448" width="920" height="78" rx="10" fill="#FFF2DE" stroke="#B66B12" stroke-width="2"/>
