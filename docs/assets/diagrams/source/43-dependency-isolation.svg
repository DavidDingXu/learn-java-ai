        <text x="456" y="288" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="26" font-weight="540" fill="#14242D" letter-spacing="0"><tspan x="456" dy="0">Boot 4.1 + Spring AI 2.0，承载生产业务主线</tspan></text><path d="M 600 322 V 339" fill="none" stroke="#C8D5DA" stroke-width="4" marker-end="url(#arrow)"/><rect data-bounded="true" data-layer="true" x="116" y="344" width="968" height="78" rx="10" fill="#E5F5EF" stroke="#178A68" stroke-width="2"/>
        <rect x="116" y="344" width="340" height="78" rx="10" fill="#178A68"/>
