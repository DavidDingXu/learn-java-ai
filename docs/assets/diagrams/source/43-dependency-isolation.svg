  <text x="76" y="146" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="760" fill="#14242D" letter-spacing="0"><tspan x="76" dy="0">Spring AI Alibaba 为什么放在独立 lab</tspan></text>
  <text x="76" y="192" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="450" fill="#5D6B73" letter-spacing="0"><tspan x="76" dy="0">主线和实验线拥有不同的 Spring Boot、Spring AI 与扩展依赖代际</tspan></text>
  <g data-diagram-kind="layers"><rect data-bounded="true" data-layer="true" x="92" y="240" width="1016" height="78" rx="10" fill="#EAF1FF" stroke="#2F6FED" stroke-width="2"/>
