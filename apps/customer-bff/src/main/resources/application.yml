server:
  port: 8080

spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: customer-bff

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

java-ai:
  runtime:
    external-integrations-enabled: true
  security:
    customer-jwt:
      enabled: true
      issuer: ${JAVA_AI_CUSTOMER_JWT_ISSUER}
      audience: customer-bff
      jwk-set-uri: ${JAVA_AI_CUSTOMER_JWT_JWK_SET_URI:}
      hmac-secret: ${JAVA_AI_CUSTOMER_JWT_HMAC_SECRET:}
  identity:
    token-endpoint: ${JAVA_AI_TOKEN_EXCHANGE_ENDPOINT}
    client-id: ${JAVA_AI_TOKEN_EXCHANGE_CLIENT_ID}
    client-secret: ${JAVA_AI_TOKEN_EXCHANGE_CLIENT_SECRET}
    timeout: 5s
  downstream:
    knowledge:
      base-url: ${JAVA_AI_KNOWLEDGE_BASE_URL}
      timeout: 10s
      stream-idle-timeout: 30s
    ticket:
      base-url: ${JAVA_AI_TICKET_BASE_URL}
      timeout: 5s
  consultation:
    session-ttl: 30m
    max-turns: 8
    max-estimated-tokens: 1200
    max-summary-chars: 800
    rate-limit:
      requests: 20
      window: 1m
