# The default demo profile starts without an identity provider or downstream services.
# Never commit real production secrets. Override production placeholders through the deployment secret manager.
server:
  port: 8080

spring:
  profiles:
    default: demo
  application:
    name: customer-bff

management:
  endpoints:
    web:
      exposure:
        include: health,prometheus
  endpoint:
    health:
      show-details: never

java-ai:
  consultation:
    session-ttl: 30m
    max-turns: 8
    max-estimated-tokens: 1200
    max-summary-chars: 800
    rate-limit:
      requests: 20
      window: 1m
  identity:
    timeout: 5s
  downstream:
    knowledge:
      timeout: 35s
      stream-idle-timeout: 30s
      stream-total-timeout: 2m
    ticket:
      timeout: 5s

---
spring:
  config:
    activate:
      on-profile: demo

java-ai:
  runtime:
    external-integrations-enabled: false
  security:
    customer-jwt:
      enabled: false
  identity:
    token-endpoint: http://localhost/disabled
    client-id: customer-bff-demo
    client-secret: not-used-in-demo
  downstream:
    knowledge:
      base-url: http://localhost:8081
    ticket:
      base-url: http://localhost:8082

---
spring:
  config:
    activate:
      on-profile: production

java-ai:
  runtime:
    external-integrations-enabled: true
  security:
    customer-jwt:
      enabled: true
      issuer: https://identity.example.com
      audience: customer-bff
      jwk-set-uri: https://identity.example.com/.well-known/jwks.json
      hmac-secret: ""
  identity:
    token-endpoint: https://identity.example.com/oauth2/token
    client-id: customer-bff
    client-secret: replace-with-secret-manager
  downstream:
    knowledge:
      base-url: http://knowledge-service:8081
    ticket:
      base-url: http://ticket-agent-service:8082
