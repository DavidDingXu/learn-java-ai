  <g data-diagram-note="true">
    <rect x="76" y="534" width="6" height="96" rx="3" fill="#2F6FED"/>
    <text x="104" y="564" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="540" fill="#5D6B73" letter-spacing="0"><tspan x="104" dy="0">同时被多个独立检索器排在前面的证据会获得更高融合分；RRF 不要求两类原始分数具有</tspan><tspan x="104" dy="34">可比性。</tspan></text>
