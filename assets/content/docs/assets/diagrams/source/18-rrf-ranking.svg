          <text x="571" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="571" dy="0">2</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="832" y="306" width="276" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
