        <text x="107" y="281" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="107" dy="0">候选 Chunk</tspan></text><rect data-bounded="true" data-matrix-header="true" x="280" y="240" width="276" height="66" fill="#2F6FED" stroke="#FFFFFF" stroke-width="2"/>
