          <text x="107" y="413" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">向量索引</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="372" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="413" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">召回速度和候选集合</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="372" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
