          <text x="345" y="479" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">候选顺序和相关性</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="438" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
