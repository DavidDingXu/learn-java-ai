          <text x="107" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">Embedding</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="306" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">维度、向量空间、距离分布</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="306" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
