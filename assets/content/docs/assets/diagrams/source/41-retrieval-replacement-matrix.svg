          <text x="107" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">阈值</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="504" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">Recall、MRR、p95 与成本</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="504" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">按业务域设置 Go / No-Go</tspan></text></g>
  <g data-diagram-note="true">
    <rect x="76" y="600" width="6" height="96" rx="3" fill="#2F6FED"/>
    <text x="104" y="630" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="540" fill="#5D6B73" letter-spacing="0"><tspan x="104" dy="0">Embedding 模型或维度变化时不能覆盖旧向量；Rerank 变化也必须在相同候选集上比较。</tspan><tspan x="104" dy="34"></tspan></text>
