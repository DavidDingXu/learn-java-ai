  <rect x="76" y="64" width="56" height="6" rx="3" fill="#2F6FED"/>
  <text x="76" y="100" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="750" fill="#2F6FED" letter-spacing="0"><tspan x="76" dy="0">INDEX TASK STATE MACHINE</tspan></text>
  <text x="76" y="146" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="38" font-weight="760" fill="#14242D" letter-spacing="0"><tspan x="76" dy="0">增量索引任务的状态必须能解释和恢复</tspan></text>
  <text x="76" y="192" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="450" fill="#5D6B73" letter-spacing="0"><tspan x="76" dy="0">状态机把待处理、持有租约、延迟重试和终态失败分开</tspan></text>
  <g data-diagram-kind="matrix"><rect data-bounded="true" data-matrix-header="true" x="92" y="240" width="238" height="66" fill="#14242D" stroke="#FFFFFF" stroke-width="2"/>
        <text x="107" y="281" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="107" dy="0">任务状态</tspan></text><rect data-bounded="true" data-matrix-header="true" x="330" y="240" width="389" height="66" fill="#2F6FED" stroke="#FFFFFF" stroke-width="2"/>
        <text x="345" y="281" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="345" dy="0">进入条件</tspan></text><rect data-bounded="true" data-matrix-header="true" x="719" y="240" width="389" height="66" fill="#2F6FED" stroke="#FFFFFF" stroke-width="2"/>
        <text x="734" y="281" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="750" fill="#FFFFFF" letter-spacing="0"><tspan x="734" dy="0">允许的下一步</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="306" width="238" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">PENDING</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="306" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">文档版本已发布，索引任务已创建</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="306" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="347" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">被一个 Worker 原子领取为 RUNNING</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="372" width="238" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="413" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">RUNNING</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="372" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="413" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">Worker 持有固定期限且未过期的租约</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="372" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="413" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">成功进入 SUCCEEDED；索引异常进入 RETRY_WAIT 或 DEAD</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="438" width="238" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="479" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">RETRY_WAIT</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="438" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="479" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">失败已记录，且未超过尝试上限</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="438" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="479" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">到达 nextAttemptAt 后由认领操作直接进入 RUNNING</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="504" width="238" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">SUCCEEDED</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="504" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">目标版本的切分与向量已幂等落库</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="504" width="389" height="66" fill="#FFFFFF" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="545" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">终态；新文档版本创建新任务</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="92" y="570" width="238" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="107" y="611" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="700" fill="#2F6FED" letter-spacing="0"><tspan x="107" dy="0">DEAD</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="330" y="570" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="345" y="611" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="345" dy="0">失败或过期租约已经耗尽尝试次数</tspan></text><rect data-bounded="true" data-matrix-cell="true" x="719" y="570" width="389" height="66" fill="#F6F9FA" stroke="#C8D5DA" stroke-width="2"/>
          <text x="734" y="611" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="24" font-weight="520" fill="#14242D" letter-spacing="0"><tspan x="734" dy="0">终态；人工修复后通过新命令重建任务</tspan></text></g>
  <g data-diagram-note="true">
    <rect x="76" y="666" width="6" height="62" rx="3" fill="#2F6FED"/>
    <text x="104" y="696" text-anchor="start" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif" font-size="25" font-weight="540" fill="#5D6B73" letter-spacing="0"><tspan x="104" dy="0">不要用一个 processing 布尔值承载全部语义；它无法表达租约、延迟重试和终态失败。</tspan></text>
  </g>
