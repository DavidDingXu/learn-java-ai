name: Reading site

on:
  push:
    branches: [gh-pages]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: reading-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/gh-pages' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
      - uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - uses: actions/deploy-pages@v5
        id: deployment
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/checkout@v6
        with:
          ref: gh-pages
          path: published-site
      - name: Verify edition and source revision
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PYCODE'
          import json, os, pathlib, subprocess
          files = list(pathlib.Path('published-site/downloads').glob('*-manifest.json'))
          assert len(files) == 1, 'Expected one edition manifest'
          edition = json.loads(files[0].read_text())
          revision = subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip()
          assert edition['git_commit'] == revision, 'Books do not match the tagged source'
          assert edition['version'] == os.environ['RELEASE_TAG'].removeprefix('v'), 'Edition version differs from tag'
          PYCODE
          cd published-site/downloads
          sha256sum --check SHA256SUMS.txt
      - name: Publish course release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          test -f "docs/releases/$RELEASE_TAG.md"
          gh release create "$RELEASE_TAG" published-site/downloads/* --verify-tag --draft --title "Java AI 应用开发实战 · $RELEASE_TAG" --notes-file "docs/releases/$RELEASE_TAG.md"
          gh release edit "$RELEASE_TAG" --draft=false --latest
