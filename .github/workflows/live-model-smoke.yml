name: Live Model Smoke

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-model:
    runs-on: ubuntu-latest
    environment: live-model-smoke
    env:
      SPRING_AI_OPENAI_API_KEY: ${{ secrets.JAVA_AI_CHAT_API_KEY }}
      SPRING_AI_OPENAI_BASE_URL: ${{ secrets.JAVA_AI_CHAT_BASE_URL }}
      SPRING_AI_OPENAI_CHAT_MODEL: ${{ vars.JAVA_AI_CHAT_MODEL }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
          cache: maven

      - name: Run explicit live model smoke
        run: scripts/run-live-model-smoke.sh

      - name: Upload redacted evidence
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: live-model-smoke-report
          path: docs/reports/lesson-04-live-model-smoke.md
