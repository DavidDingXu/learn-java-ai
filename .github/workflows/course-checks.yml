name: Course checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  course:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Test newline compatibility and missing-image detection
        run: node --test scripts/check-course.test.mjs
      - name: Check full articles, images and navigation
        run: node scripts/check-course.mjs
