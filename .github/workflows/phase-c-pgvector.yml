name: Phase C pgvector integration

on:
  workflow_dispatch:
  push:
    paths:
      - "pom.xml"
      - "services/knowledge-service/**"
      - ".github/workflows/phase-c-pgvector.yml"

jobs:
  pgvector-integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: java_ai_test
          POSTGRES_USER: java_ai
          POSTGRES_PASSWORD: java_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U java_ai -d java_ai_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      JAVA_AI_POSTGRES_URL: jdbc:postgresql://localhost:5432/java_ai_test
      JAVA_AI_POSTGRES_USER: java_ai
      JAVA_AI_POSTGRES_PASSWORD: java_ai_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify Flyway, pgvector and ACL-before-TopK
        run: ./mvnw -pl services/knowledge-service verify -Pexternal-integration
